services:  
  mongodb:  
    image: mongo:7  
    container_name: mongodb  
    restart: unless-stopped  
    ports:  
      - "27017:27017"  
    volumes:  
      - mongodb_data:/data/db  
  
  backend:  
    container_name: backend  
    build:  
      context: ./backend  
      dockerfile: Dockerfile.dev  
    ports:  
      - "${BACKEND_PORT}:3000"  
    env_file:  
      - .env  
    environment:  
      NODE_ENV: development  
      PORT: 3000  
    depends_on:  
      - mongodb  
    restart: unless-stopped  
    volumes:  
      - ./backend:/app  
      - /app/node_modules  
  
  frontend:  
    container_name: frontend  
    build:  
      context: ./frontend  
      dockerfile: Dockerfile.dev  
    working_dir: /app  
    ports:  
      - "${FRONTEND_PORT}:5173"  
    environment:  
      NODE_ENV: development  
      VITE_API_URL: ${VITE_API_URL}  
    depends_on:  
      - backend  
    restart: unless-stopped  
    volumes:  
      - ./frontend:/app  
      - /app/node_modules  
  
volumes:  
  mongodb_data:
