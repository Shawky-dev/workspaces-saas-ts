services:  
  mongodb:  
    image: mongo:7  
    container_name: mongodb  
    restart: unless-stopped  
    ports:  
      - "27017:27017"  
    volumes:  
      - mongodb_data:/data/db  
  
  backend:  
    container_name: backend  
    build:  
      context: ./backend  
      dockerfile: Dockerfile.dev  
    ports:  
      - "${BACKEND_PORT}:3000"  
    env_file:  
      - .env  
    environment:  
      NODE_ENV: development  
      PORT: 3000  
    depends_on:  
      - mongodb  
    restart: unless-stopped  
    volumes:  
      - ./backend:/app  
      - ./dummy_products:/app/dummy_products:ro
      - /app/node_modules  
  
  frontend:  
    container_name: frontend  
    build:  
      context: ./frontend  
      dockerfile: Dockerfile.dev  
    working_dir: /app  
    ports:  
      - "${FRONTEND_PORT}:5173"  
    environment:  
      NODE_ENV: development  
      VITE_API_URL: /api  # Changed to relative path  
    depends_on:  
      - backend  
    restart: unless-stopped  
    volumes:  
      - ./frontend:/app  
      - /app/node_modules  
  
  nginx:  
    image: nginx:alpine  
    container_name: nginx  
    ports:  
      - "80:80"  
    volumes:  
      - ./nginx.conf:/etc/nginx/conf.d/default.conf  
    depends_on:  
      - frontend  
      - backend  
    restart: unless-stopped  
  
volumes:  
  mongodb_data:
