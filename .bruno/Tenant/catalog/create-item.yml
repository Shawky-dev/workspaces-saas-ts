info:
  name: create-item
  type: http
  seq: 1

http:
  method: POST
  url: "{{URL}}/{{tenantId}}/catalog/items"
  body:
    type: multipartForm
    multipartForm:
      - name: name
        value: Coffee
        type: text
      - name: purchasePrice
        value: "20"
        type: text
      - name: soldPrice
        value: "35"
        type: text
      - name: description
        value: Simple workspace snack item
        type: text
      - name: image
        value: ""
        type: file
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
