info:
  name: bulk-update-quantities
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{URL}}/{{tenantId}}/catalog/items/quantities"
  body:
    type: json
    data: |-
      {
        "items": [
          {
            "id": "{{catalogItemId}}",
            "quantityOnHand": 24
          }
        ]
      }
  auth:
    type: bearer
    token: "{{JWT}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
