info:
  name: start-session
  type: http
  seq: 3

http:
  method: POST
  url: "{{URL}}/{{tenantId}}/sessions"
  body:
    type: json
    data: |-
      {
        "customerId": "{{customerId}}",
        "roomBookings": [
          {
            "roomId": "{{privateRoomId}}",
            "seatCount": 1
          },
          {
            "roomId": "{{publicRoomId}}",
            "seatCount": 2
          }
        ]
      }
  auth:
    type: bearer
    token: "{{JWT}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
